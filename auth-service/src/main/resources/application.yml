server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # PostgreSQL by default. For a zero-setup local run without Postgres use: --spring.profiles.active=h2
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    baseline-on-migrate: true   # adopt databases created by an older ddl-auto=update run
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}   # schema is owned by Flyway (db/migration); use DDL_AUTO=validate to double-check entities vs schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_VALIDITY_MS:86400000}

bootstrap:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:REPLACE_WITH_YOUR_GOOGLE_OAUTH_CLIENT_ID}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.realtime.delivery: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
