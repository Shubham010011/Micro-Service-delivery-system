# Local-only, in-memory database. Activate with: --spring.profiles.active=h2   (data is lost on restart)
spring:
  flyway:
    enabled: false   # Postgres-specific SQL; H2 profile lets Hibernate create the schema
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
