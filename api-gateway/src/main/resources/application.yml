server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # ---- Auth (public: register/login/google) ----
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT,BAD_GATEWAY
                methods: POST

        # ---- Customer-facing order + delivery endpoints ----
        - id: order-service-customer
          uri: lb://order-service
          predicates:
            - Path=/api/customer/orders/**

        - id: delivery-service-customer
          uri: lb://delivery-service
          predicates:
            - Path=/api/customer/deliveries/**

        # ---- Delivery-partner ("staff") endpoints - hidden from customers ----
        - id: order-service-staff
          uri: lb://order-service
          predicates:
            - Path=/staff/orders/**

        - id: delivery-service-staff
          uri: lb://delivery-service
          predicates:
            - Path=/staff/deliveries/**

        # ---- Admin endpoints - hidden from customers and delivery partners ----
        - id: order-service-admin
          uri: lb://order-service
          predicates:
            - Path=/admin/orders/**

        - id: delivery-service-admin
          uri: lb://delivery-service
          predicates:
            - Path=/admin/delivery-partners/**

        # ---- Notifications: role-agnostic REST history + raw WebSocket upgrade ----
        - id: notification-service-api
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # WebSocket upgrades need a ws:// target (lb:ws://); SockJS's plain-HTTP fallback transports use the lb:// routes below.
        - id: notification-service-ws
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/notifications/**
            - Header=Upgrade, (?i)websocket

        - id: notification-service-sockjs
          uri: lb://notification-service
          predicates:
            - Path=/ws/notifications/**

        - id: delivery-service-ws
          uri: lb:ws://delivery-service
          predicates:
            - Path=/ws/chat/**
            - Header=Upgrade, (?i)websocket

        - id: delivery-service-sockjs
          uri: lb://delivery-service
          predicates:
            - Path=/ws/chat/**

      httpclient:
        connect-timeout: 5000
        response-timeout: 15s

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.realtime.delivery: INFO
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
