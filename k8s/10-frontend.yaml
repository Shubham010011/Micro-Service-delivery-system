apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiftdrop-frontend
  namespace: swiftdrop
spec:
  replicas: 2
  selector:
    matchLabels: { app: swiftdrop-frontend }
  template:
    metadata:
      labels: { app: swiftdrop-frontend }
    spec:
      containers:
        - name: frontend
          image: swiftdrop/frontend:1.0.0
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: swiftdrop-frontend
  namespace: swiftdrop
spec:
  selector: { app: swiftdrop-frontend }
  ports:
    - port: 80
      targetPort: 80
