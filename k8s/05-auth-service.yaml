apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: swiftdrop
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: auth-service
          image: swiftdrop/auth-service:1.0.0
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: swiftdrop-config }
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/authdb
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: JWT_SECRET } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: DB_PASSWORD } }
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: GOOGLE_CLIENT_ID } }
            - name: ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: ADMIN_EMAIL, optional: true } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: ADMIN_PASSWORD, optional: true } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: swiftdrop
spec:
  selector: { app: auth-service }
  ports:
    - port: 8081
      targetPort: 8081
