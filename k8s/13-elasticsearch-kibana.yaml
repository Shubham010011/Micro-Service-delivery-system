apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports: [{ containerPort: 9200 }]
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: data
          emptyDir: {}   # swap for a PVC in production so log history survives pod restarts
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: swiftdrop
spec:
  selector: { app: elasticsearch }
  ports:
    - port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels: { app: kibana }
  template:
    metadata:
      labels: { app: kibana }
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.14.3
          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch:9200"]'
          ports: [{ containerPort: 5601 }]
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: swiftdrop
spec:
  selector: { app: kibana }
  ports:
    - port: 5601
      targetPort: 5601
