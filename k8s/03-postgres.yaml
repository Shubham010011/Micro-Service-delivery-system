apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: swiftdrop
data:
  init-multiple-postgres-databases.sh: |
    #!/bin/bash
    set -e
    function create_database() {
      local database=$1
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        CREATE DATABASE $database;
    EOSQL
    }
    for db in authdb orderdb deliverydb notificationdb; do
      create_database "$db"
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: swiftdrop
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              value: swiftdrop
            - name: POSTGRES_DB
              value: swiftdrop
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: swiftdrop-secrets, key: DB_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "swiftdrop"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-pvc }
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: swiftdrop
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
