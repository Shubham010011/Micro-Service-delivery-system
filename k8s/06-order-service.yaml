apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: swiftdrop
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: order-service
          image: swiftdrop/order-service:1.0.0
          ports: [{ containerPort: 8082 }]
          envFrom:
            - configMapRef: { name: swiftdrop-config }
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/orderdb
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: JWT_SECRET } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: swiftdrop-secrets, key: DB_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: swiftdrop
spec:
  selector: { app: order-service }
  ports:
    - port: 8082
      targetPort: 8082
