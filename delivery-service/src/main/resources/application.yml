server:
  port: 8083

spring:
  application:
    name: delivery-service
  datasource:
    # PostgreSQL by default. For a zero-setup local run without Postgres use: --spring.profiles.active=h2
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deliverydb}
    username: ${DB_USERNAME:swiftdrop}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    baseline-on-migrate: true   # adopt databases created by an older ddl-auto=update run
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}  
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.realtime.delivery: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Offer expiry / retry (see DeliveryAssignmentService.processPendingDispatch)
dispatch:
  offer-ttl-seconds: ${DISPATCH_OFFER_TTL_SECONDS:90}
  retry-interval-seconds: ${DISPATCH_RETRY_INTERVAL_SECONDS:10}
  give-up-minutes: ${DISPATCH_GIVE_UP_MINUTES:30}
  sweep-interval-ms: 5000
