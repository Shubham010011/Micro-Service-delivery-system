input {
  beats {
    port => 5044
  }
}

filter {
  # Docker's json-file log driver wraps each line as {"log": "...", "container": {...}}; Filebeat's
  # docker autodiscover already extracts "message" for us, so just tag the service name for Kibana.
  if [container][labels][com_docker_compose_service] {
    mutate {
      add_field => { "service_name" => "%{[container][labels][com_docker_compose_service]}" }
    }
  }

  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+\[%{DATA:thread}\]\s+%{LOGLEVEL:level}\s+%{DATA:logger}\s+-\s+%{GREEDYDATA:log_message}" }
    tag_on_failure => ["_grokparsefailure_plain"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "swiftdrop-logs-%{+YYYY.MM.dd}"
  }
}
